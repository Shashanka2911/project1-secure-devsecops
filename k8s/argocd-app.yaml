apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devsecops-product-app
  namespace: argocd
spec:
  project: default
  source:
    # Put your actual GitHub repository URL here
    repoURL: 'https://github.com//project1-secure-devsecops.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: devsecops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true